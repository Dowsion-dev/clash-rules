name: Update MRS rules

on:
  schedule:
    # UTC 01:00 = 北京时间 / 新加坡时间 09:00
    - cron: '0 1 * * *'
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/run.yml'
      - 'scripts/build.py'

permissions:
  contents: write

concurrency:
  group: update-mrs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch previous release branch
        shell: bash
        run: |
          set -euo pipefail
          refs=$(git ls-remote --heads origin refs/heads/release)
          if [ -n "$refs" ]; then
            git fetch origin release
            git worktree add output FETCH_HEAD
          else
            git worktree add --detach output
            (cd output && git checkout --orphan release && git rm -rf .)
          fi
      - name: Download and convert changed rules
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/build.py --output output
      - name: Publish updated files
        working-directory: output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add direct.mrs reject.mrs cncidr.mrs sources manifest.json LICENSE README.md
          if git diff --cached --quiet; then
            echo 'No changes to publish.' >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m 'Update MRS rules'
            git push origin HEAD:refs/heads/release
            echo 'Published direct.mrs, reject.mrs and cncidr.mrs to release.' >> "$GITHUB_STEP_SUMMARY"
          fi
